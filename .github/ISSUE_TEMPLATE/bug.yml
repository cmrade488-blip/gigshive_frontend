name: Bug
description: Something behaves differently from the spec
title: "bug: "
labels: ["type:bug"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [web, admin, packages]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Quote the spec (document and section) where possible.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the request id from the error screen if there is one. Do not paste personal or financial data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
