<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.navi:hover{background:rgba(255,255,255,0.08) !important}
.hexbg{background-image:url(../../../brand/images/patterns/hex-pattern.svg);background-size:104px 120px;opacity:0.06}
</style>
</helmet>
<aside style="position: relative; overflow: hidden; box-sizing: border-box; width: 100%; min-height: 100%; background: #0F1626; color: #FFFFFF; padding: 24px 16px; display: flex; flex-direction: column; gap: 24px; font-family: Inter, system-ui, sans-serif">
<div class="hexbg" style="position: absolute; inset: 0"></div>
<div style="position: relative; padding: 0 8px"><a href="Main.dc.html" aria-label="GigsHive home"><img src="../../../brand/logo/gigshive-logo-reversed.svg" alt="GigsHive" style="height: 32px; width: auto; display: block"></a></div>

<div style="position: relative; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 14px">
<div style="font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: #AEB9CC; margin-bottom: 10px">Acting as</div>
<div style="display: flex; align-items: center; gap: 12px">
<img src="../../../brand/images/avatars/avatar-04.svg" alt="" style="width: 40px; height: 40px; border-radius: 9999px; display: block">
<div style="flex: 1; min-width: 0"><div style="font-weight: 600; font-size: 14px">Amaka O.</div><div style="font-size: 13px; color: #FFB91F">{{roleLabel}}</div></div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#AEB9CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5-5 5 5M7 14l5 5 5-5"/></svg>
</div>
<div style="display: flex; gap: 6px; margin-top: 12px">
<span style="{{clientChip}}">Client</span><span style="{{workerChip}}">Worker</span>
</div>
</div>

<nav aria-label="App" style="position: relative; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{items}}" as="n" hint-placeholder-count="5">
<a class="navi" href="{{n.href}}" style="{{n.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"/></svg>{{n.label}}</a>
</sc-for>
</nav>

<div style="position: relative; margin-top: auto; background: linear-gradient(135deg, #FFB91F, #F5A000); border-radius: 20px; padding: 18px; color: #0F1626">
<div style="font-size: 13px; font-weight: 600">Wallet</div>
<div style="font-family: Poppins, Inter, sans-serif; font-weight: 700; font-size: 22px; margin: 2px 0 10px">₦ 185,000</div>
<a href="Wallet.dc.html" style="display: block; text-align: center; background: #0F1626; color: #FFFFFF; font-size: 13px; font-weight: 600; padding: 10px; border-radius: 9999px">Open wallet</a>
</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","default":"client","options":["client","worker"]},"active":{"editor":"text","default":"dashboard"},"$preview":{"width":264,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const role = this.props.role ?? 'client';
const active = this.props.active ?? 'dashboard';
const on = 'display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; font-size: 15px; font-weight: 600; color: #0F1626; background: #FFB91F';
const off = 'display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; font-size: 15px; font-weight: 500; color: #D0D7E3';
const D = { home: 'M3 10.5 12 3l9 7.5M5 9.5V20h14V9.5M10 20v-6h4v6', jobs: 'M3 7h18v13H3zM9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18', people: 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c0-3.3 2.9-5 6.5-5s6.5 1.7 6.5 5M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.8c2.2.5 3.5 2 3.5 4.7', file: 'M6 3h8l5 5v12H6zM14 3v5h5M8.5 13h7M8.5 17h5', wallet: 'M3 7a2 2 0 0 1 2-2h11v2M3 7v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2M3 7h16a2 2 0 0 1 2 2v3M21 12v4h-4a2 2 0 0 1 0-4z', user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20c0-4 3.6-6 8-6s8 2 8 6', search: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5' };
const client = [
{ k: 'dashboard', label: 'Dashboard', href: 'Dashboard.dc.html', d: D.home },
{ k: 'jobs', label: 'My jobs', href: 'PostJob.dc.html', d: D.jobs },
{ k: 'proposals', label: 'Proposals', href: 'Proposals.dc.html', d: D.people },
{ k: 'contracts', label: 'Contracts', href: 'Contract.dc.html', d: D.file },
{ k: 'wallet', label: 'Wallet', href: 'Wallet.dc.html', d: D.wallet },
{ k: 'profile', label: 'Profile', href: 'Profile.dc.html', d: D.user }
];
const worker = [
{ k: 'dashboard', label: 'Dashboard', href: 'DashboardWorker.dc.html', d: D.home },
{ k: 'find', label: 'Find work', href: 'Jobs.dc.html', d: D.search },
{ k: 'applications', label: 'My proposals', href: 'Apply.dc.html', d: D.people },
{ k: 'contracts', label: 'Contracts', href: 'Contract.dc.html', d: D.file },
{ k: 'wallet', label: 'Wallet', href: 'Wallet.dc.html', d: D.wallet },
{ k: 'profile', label: 'Profile', href: 'Profile.dc.html', d: D.user }
];
const base = 'font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 9999px';
const chipOn = base + '; background: #FFB91F; color: #0F1626';
const chipOff = base + '; background: rgba(255,255,255,0.1); color: #D0D7E3';
return {
roleLabel: role === 'client' ? 'Client profile' : 'Worker profile',
clientChip: role === 'client' ? chipOn : chipOff,
workerChip: role === 'worker' ? chipOn : chipOff,
items: (role === 'client' ? client : worker).map((n) => ({ ...n, style: n.k === active ? on : off }))
};
}
}
</script>
</body>
</html>
