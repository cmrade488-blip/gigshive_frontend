<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<header style="box-sizing: border-box; width: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; font-family: Inter, system-ui, sans-serif; color: #0F1626">
<div>
<h1 style="font-family: Poppins, Inter, sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.6px; margin: 0">{{title}}</h1>
<p style="margin: 2px 0 0; font-size: 15px; color: #3E4B66">{{subtitle}}</p>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<form action="Jobs.dc.html" style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 9999px; padding: 4px 18px; box-shadow: 0 2px 8px rgba(15,22,38,0.06)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6985" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5"/></svg>
<label for="tb-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</label>
<input id="tb-q" type="search" placeholder="Search" style="border: 0; outline: 0; font: inherit; font-size: 15px; padding: 10px 0; width: 160px; background: transparent">
</form>
<a href="Dashboard.dc.html" aria-label="Notifications" style="position: relative; width: 48px; height: 48px; border-radius: 9999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(15,22,38,0.06)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F1626" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2.5h-15zM10 21h4"/></svg><span style="position: absolute; top: 12px; right: 13px; width: 9px; height: 9px; border-radius: 9999px; background: #F5A000; border: 2px solid #FFFFFF"></span></a>
<img src="../../../brand/images/avatars/avatar-04.svg" alt="Your account" style="width: 48px; height: 48px; border-radius: 9999px; display: block">
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Dashboard"},"subtitle":{"editor":"text","default":""},"$preview":{"width":1100,"height":64}}'>
class Component extends DCLogic {
renderVals() {
return { title: this.props.title ?? 'Dashboard', subtitle: this.props.subtitle ?? '' };
}
}
</script>
</body>
</html>
