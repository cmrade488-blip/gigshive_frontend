<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Floating site header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.navlink:hover{color:#0F1626 !important;background:#F4F6FA}
.join:hover{background:#FFB91F !important}
</style>
</helmet>
<header style="box-sizing: border-box; width: 100%; padding: 20px 24px 0; font-family: Inter, system-ui, sans-serif; color: #0F1626">
<div style="max-width: 1200px; margin: 0 auto; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding: 10px 10px 10px 28px; border-radius: 36px; background: rgba(255,255,255,0.92); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 12px 40px rgba(9,14,26,0.28); backdrop-filter: blur(16px)">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px">
<a href="Main.dc.html" aria-label="GigsHive home" style="display: flex; align-items: center"><img src="../../../brand/logo/gigshive-logo.svg" alt="GigsHive" style="height: 34px; width: auto; display: block"></a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px; font-size: 15px; font-weight: 500">
<a class="navlink" href="Jobs.dc.html" style="{{jobsStyle}}">Find work</a>
<a class="navlink" href="HowItWorks.dc.html" style="{{howStyle}}">How it works</a>
<a class="navlink" href="Auth.dc.html" style="padding: 10px 16px; border-radius: 9999px; color: #3E4B66">Post a job</a>
</nav>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<a class="navlink" href="Auth.dc.html" style="padding: 10px 18px; font-size: 15px; font-weight: 600; color: #0F1626; border-radius: 9999px">Sign in</a>
<a class="join" href="Auth.dc.html" style="padding: 12px 24px; font-size: 15px; font-weight: 600; background: #F5A000; color: #0F1626; border-radius: 9999px">Join free</a>
</div>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","default":"none","options":["none","jobs","how"]},"$preview":{"width":1440,"height":92}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'none';
const base = 'padding: 10px 16px; border-radius: 9999px; color: #3E4B66';
const on = 'padding: 10px 16px; border-radius: 9999px; color: #0F1626; background: #FFEEC2';
return { jobsStyle: a === 'jobs' ? on : base, howStyle: a === 'how' ? on : base };
}
}
</script>
</body>
</html>
