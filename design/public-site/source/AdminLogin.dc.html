<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.lift{transition:transform .15s,box-shadow .15s}
.lift:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(15,22,38,0.12)}
.hexbg{background-image:url(../../../brand/images/patterns/hex-pattern.svg);background-size:104px 120px;opacity:0.07}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid #FFB91F;outline-offset:1px}
</style>
</helmet>
<div style="width:100%;min-height:100vh;box-sizing:border-box;position:relative;overflow:hidden;background:#0B1120;font-family:Inter,system-ui,sans-serif;color:#0F1626;line-height:1.5;padding-bottom:72px">
<div class="hexbg" style="position:absolute;inset:0"></div>
<div style="position:absolute;right:-160px;top:-200px;width:760px;height:760px;background:radial-gradient(circle,rgba(245,160,0,0.4),rgba(245,160,0,0) 66%)"></div>
<div style="position:relative">
<div style="max-width:480px;margin:96px auto 0;padding:0 24px"><div style="display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:24px"><img src="../../../brand/logo/gigshive-logo-reversed.svg" alt="GigsHive" style="height:36px"><span style="font-size:12px;font-weight:700;letter-spacing:0.6px;background:#2563EB;color:#FFFFFF;padding:5px 12px;border-radius:9999px">ADMIN</span></div>
<div style="background:#FFFFFF;border-radius:36px;padding:40px;box-shadow:0 30px 80px rgba(0,0,0,0.5);box-sizing:border-box;height:480px;display:flex;flex-direction:column">
<sc-if value="{{s1}}" hint-placeholder-val="{{true}}"><div style="display:flex;flex-direction:column;gap:16px;flex:1"><div><h1 style="font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:28px;letter-spacing:-0.5px;margin:0">Staff sign in</h1><p style="margin:6px 0 0;color:#3E4B66;font-size:15px">For GigsHive staff only.</p></div><div style="display:flex;flex-direction:column;gap:6px"><label for="as-e" style="font-size:14px;font-weight:600">Work email</label><input id="as-e" type="email" autocomplete="email" placeholder="" style="font:inherit;font-size:16px;padding:13px 18px;border:1px solid #D0D7E3;border-radius:14px;background:#F4F6FA;min-height:24px"></div><div style="display:flex;flex-direction:column;gap:6px"><label for="as-p" style="font-size:14px;font-weight:600">Password</label><input id="as-p" type="password" autocomplete="current-password" placeholder="" style="font:inherit;font-size:16px;padding:13px 18px;border:1px solid #D0D7E3;border-radius:14px;background:#F4F6FA;min-height:24px"></div><button type="button" onClick="{{next}}" style="background:#F5A000;color:#0F1626;font-weight:600;font-size:16px;padding:16px 20px;border-radius:9999px;text-align:center;border:0;cursor:pointer;min-height:52px;box-sizing:border-box;flex:1;flex:none;margin-top:auto">Continue</button></div></sc-if>
<sc-if value="{{s2}}" hint-placeholder-val="{{false}}"><div style="display:flex;flex-direction:column;gap:16px;flex:1"><div><h1 style="font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:28px;letter-spacing:-0.5px;margin:0">Enter your code</h1><p style="margin:6px 0 0;color:#3E4B66;font-size:15px">Enter the 6-digit code from your authenticator app.</p></div><div style="display:flex;flex-direction:column;gap:6px"><label for="as-c" style="font-size:14px;font-weight:600">6-digit code</label><input id="as-c" type="text" autocomplete="one-time-code" placeholder="123456" style="font:inherit;font-size:16px;padding:13px 18px;border:1px solid #D0D7E3;border-radius:14px;background:#F4F6FA;min-height:24px"></div><div style="margin-top:auto;display:flex;gap:12px"><button type="button" onClick="{{back}}" style="background:#FFFFFF;color:#0F1626;font-weight:600;font-size:16px;padding:14px 22px;border-radius:9999px;text-align:center;border:1.5px solid #AEB9CC;cursor:pointer;min-height:52px;box-sizing:border-box">Back</button><a href="AdminDashboard.dc.html" style="background:#F5A000;color:#0F1626;font-weight:600;font-size:16px;padding:16px 20px;border-radius:9999px;text-align:center;border:0;cursor:pointer;min-height:52px;box-sizing:border-box;flex:1;display:block">Sign in</a></div></div></sc-if>
</div><p style="text-align:center;color:#AEB9CC;font-size:13px;margin-top:16px">Two steps: password, then a code. Failed attempts are limited and logged.</p></div></div></div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 800}}'>
class Component extends DCLogic {
state = { step: 1 };
renderVals() { const s = this.state.step; return { s1: s === 1, s2: s === 2, next: () => this.setState({ step: 2 }), back: () => this.setState({ step: 1 }) }; }
}
</script>
</body>
</html>
